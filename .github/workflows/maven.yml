name: Java CI + Horusec analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:

jobs:
  build_and_scan:
    runs-on: ubuntu-latest
    steps:
      # Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Java (usar JDK 8)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8.0.362'
          cache: maven

      # Compilar proyecto con Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Ejecutar Horusec CLI sin Docker (-D)
      - name: Run Horusec Scan (Docker)
        run: |
          set -euxo pipefail
          docker run --rm \
          -v "${GITHUB_WORKSPACE}:/src" \ -w /src \
          -v /var/run/docker.sock:/var/run/docker.sock \
          horuszup/horusec-cli:v2.9.0-beta.3 \
          sh -c 'horusec start -D -p . \
                    --output-format json \
                    --json-output-file horusec-report.json \
                    --information-severity=true \
                    -t 600'
          ls -la horusec-report.json
          test -f horusec-report.json

      # 5️⃣ Chequear vulnerabilidades HIGH o CRITICAL
      - name: Check for HIGH or CRITICAL vulnerabilities
        run: |
          test -f horusec-report.json || (echo "horusec-report.json not found!" && exit 1)
          HIGH_CRIT=$(jq '[.analysisVulnerabilities[]?.vulnerability | select(.severity == "HIGH" or .severity == "CRITICAL")] | length' horusec-report.json)
          echo "Number of HIGH or CRITICAL vulnerabilities: $HIGH_CRIT"
          if [ "$HIGH_CRIT" -gt 0 ]; then
            echo "❌ Found $HIGH_CRIT HIGH or CRITICAL vulnerabilities."
            exit 1
          else
            echo "✅ No HIGH or CRITICAL vulnerabilities found."
          fi

      # Verificar que se generó el archivo
      - name: Check Horusec report
        run: ls -la horusec-report.json

      # Subir el JSON como artifact para poder descargarlo
      - name: Upload Horusec report
        uses: actions/upload-artifact@v4
        with:
          name: horusec-report
          path: horusec-report.json
